services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 120s
      retries: 60
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: virtual-human-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "10m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ! ollama show qwen3.5:2b >/dev/null 2>&1; then
          echo "Downloading qwen3.5:2b..."
          ollama pull qwen3.5:2b
        fi
        echo "Warming up qwen3.5:2b..."
        ollama run --think=false --keepalive=10m qwen3.5:2b "Reply with READY only."
        echo "Ollama model is ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  tts-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: virtual-human-tts
    ports:
      - "8000:8000"
    environment:
      KOKORO_URL: http://kokoro:8880
      LLM_ENABLED: "true"
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen3.5:2b
      LLM_TEMPERATURE: "0.7"
      LLM_MAX_TOKENS: "256"
      LLM_CONTEXT_LENGTH: "8192"
      LLM_PROVIDER: ollama
      TTS_PROVIDER: kokoro
      STT_PROVIDER: whisper-http
      STT_BASE_URL: http://stt-server:8001
      LLM_TIMEOUT: "120"
      LLM_HISTORY_TURNS: "8"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kokoro:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      stt-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  stt-server:
    build:
      context: .
      dockerfile: stt-server/Dockerfile
    container_name: virtual-human-stt
    ports:
      - "8001:8001"
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    volumes:
      - whisper-models:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 300s
      retries: 60
    restart: unless-stopped

  talking-avatar:
    build:
      context: ./talking-avatar
      dockerfile: Dockerfile
      args:
        VITE_TTS_SERVER_URL: http://localhost:8000
        VITE_STT_SERVER_URL: http://localhost:8000
    container_name: virtual-human-avatar
    ports:
      - "4173:4173"
    depends_on:
      tts-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 30
    restart: unless-stopped

volumes:
  ollama-models:
  whisper-models:
