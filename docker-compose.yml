services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 120s
      retries: 60
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: virtual-human-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    volumes:
      - ./backend/config.yaml:/app-config.yaml:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        LLM_URL=$$(sed -n 's/^llm_url: *//p' /app-config.yaml)
        OLLAMA_MODEL=$$(sed -n 's/^llm_model: *//p' /app-config.yaml)
        if [ -z "$$OLLAMA_MODEL" ]; then
          echo "llm_model is missing from backend/config.yaml"
          exit 1
        fi
        if [ "$$LLM_URL" != "http://ollama:11434/v1" ] && [ "$$LLM_URL" != "http://ollama:11434" ]; then
          echo "Using external OpenAI-compatible API; skipping Ollama model setup."
          exit 0
        fi
        if ! ollama show "$$OLLAMA_MODEL" >/dev/null 2>&1; then
          echo "Downloading $$OLLAMA_MODEL..."
          ollama pull "$$OLLAMA_MODEL"
        fi
        echo "Warming up $$OLLAMA_MODEL..."
        ollama run --think=false --keepalive=10m "$$OLLAMA_MODEL" "Reply with READY only."
        echo "Ollama model is ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtual-human-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/config.yaml:/app/backend/config.yaml:ro
      - ./.cache/faster-whisper:/app/.cache/faster-whisper:ro
      - ./backend/supertonic/assets:/app/backend/supertonic/assets:ro
      - ./backend/metrics-data:/app/data
    environment:
      METRICS_CSV_PATH: /app/data/metrics.csv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kokoro:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  talking-avatar:
    build:
      context: ./talking-avatar
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8000
    container_name: virtual-human-avatar
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 30
    restart: unless-stopped

volumes:
  ollama-models:
