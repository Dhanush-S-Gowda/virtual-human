<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Local TalkingHead Avatar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;

            overflow: hidden;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #111;
        }

        #app {
            position: relative;

            width: 100%;
            height: 100%;
        }

        /*
         * TalkingHead renders the Three.js scene here.
         */
        #avatar {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;
        }

        /*
         * Status indicator.
         */
        #status {
            position: absolute;

            top: 20px;
            left: 20px;

            z-index: 10;

            padding: 8px 12px;

            border-radius: 8px;

            background: rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 14px;
        }

        /*
         * Loading indicator.
         */
        #loading {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            z-index: 20;

            color: white;

            font-size: 18px;
        }

        /*
         * Transcript display box.
         */
        #transcriptContainer {
            position: absolute;

            top: 20px;
            right: 20px;

            width: 340px;
            max-width: calc(100% - 40px);

            z-index: 10;

            padding: 14px 16px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.75);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.12);

            color: white;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        #transcriptHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;

            margin-bottom: 8px;
        }

        #transcriptBody {
            font-size: 14px;
            line-height: 1.45;
            color: #f3f4f6;
            word-break: break-word;
        }

        .transcript-user {
            color: #60a5fa;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .transcript-text {
            color: #f9fafb;
            font-style: italic;
        }

        .transcript-error {
            color: #f87171;
        }

        /*
         * Push-to-talk visual indicator banner.
         */
        #pttBanner {
            position: absolute;

            bottom: 84px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 10;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px 22px;

            border-radius: 30px;

            background: rgba(0, 0, 0, 0.75);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            color: white;

            font-size: 14px;
            font-weight: 500;

            pointer-events: none;

            user-select: none;

            transition: all 0.2s ease;
        }

        #pttBanner.ptt-idle {
            background: rgba(0, 0, 0, 0.75);
            border-color: rgba(255, 255, 255, 0.15);
        }

        @keyframes ptt-pulse {
            0% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                transform: translateX(-50%) scale(1.03);
                box-shadow: 0 0 0 12px rgba(239, 68, 68, 0);
            }
            100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        #pttBanner.ptt-listening {
            background: rgba(220, 38, 38, 0.9);
            border-color: #ef4444;
            animation: ptt-pulse 1.4s infinite;
        }

        #pttBanner.ptt-transcribing {
            background: rgba(217, 119, 6, 0.9);
            border-color: #f59e0b;
        }

        #pttBanner.ptt-error {
            background: rgba(185, 28, 28, 0.9);
            border-color: #ef4444;
        }

        @keyframes ptt-thinking {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7);
            }
            50% {
                transform: translateX(-50%) scale(1.02);
                box-shadow: 0 0 0 10px rgba(139, 92, 246, 0);
            }
        }

        #pttBanner.ptt-thinking {
            background: rgba(109, 40, 217, 0.9);
            border-color: #8b5cf6;
            animation: ptt-thinking 1.6s infinite;
        }

        /* Avatar reply in transcript */
        .transcript-avatar {
            color: #34d399;
            font-weight: 600;
            margin-bottom: 2px;
            margin-top: 10px;
        }

        .transcript-reply {
            color: #ecfdf5;
        }

        .transcript-thinking {
            color: #a78bfa;
            font-style: italic;
        }

        /*
         * Bottom control panel.
         */
        #controls {
            position: absolute;

            left: 20px;
            right: 20px;
            bottom: 20px;

            z-index: 10;

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            padding: 12px;

            border-radius: 12px;

            background: rgba(0, 0, 0, 0.75);

            backdrop-filter: blur(10px);
        }

        #speechText {
            flex: 1 1 300px;

            min-width: 200px;

            padding: 10px 12px;

            border: 1px solid #555;

            border-radius: 7px;

            outline: none;

            background: #222;

            color: white;

            font-size: 15px;
        }

        #controls button {
            padding: 10px 14px;

            border: none;

            border-radius: 7px;

            background: #333;

            color: white;

            cursor: pointer;

            font-size: 14px;

            transition:
                background 0.15s ease,
                transform 0.1s ease;
        }

        #controls button:hover {
            background: #444;
        }

        #controls button:active {
            transform: scale(0.97);
        }

        #controls button.primary {
            background: #2563eb;
        }

        #controls button.primary:hover {
            background: #1d4ed8;
        }

        #controls button.danger {
            background: #991b1b;
        }

        @media (max-width: 700px) {
            #controls {
                left: 10px;
                right: 10px;
                bottom: 10px;
            }

            #pttBanner {
                bottom: 140px;
            }

            #status {
                top: 10px;
                left: 10px;
            }

            #transcriptContainer {
                top: 60px;
                right: 10px;
                width: calc(100% - 20px);
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- TalkingHead renders here -->
    <div id="avatar"></div>

    <!-- Status -->
    <div id="status">
        Initializing...
    </div>

    <!-- Loading -->
    <div id="loading">
        Loading avatar...
    </div>

    <!-- Transcript Area -->
    <div id="transcriptContainer">
        <div id="transcriptHeader">
            <span>Conversation</span>
            <span id="sttBadge">STT: faster-whisper</span>
        </div>
        <div id="transcriptBody">
            <span style="color: #9ca3af;">Hold SPACE to speak to the avatar...</span>
        </div>
    </div>

    <!-- Push-to-Talk visual feedback banner -->
    <div id="pttBanner" class="ptt-idle">
        <span id="pttIcon">🎤</span>
        <span id="pttText">Hold SPACE to speak</span>
    </div>

    <!-- Controls -->
    <div id="controls">

        <input
            id="speechText"
            type="text"
            value="Hello! I am your avatar."
            placeholder="Type something to say..."
        />

        <button
            id="speakButton"
            class="primary"
        >
            Speak
        </button>

        <button id="idleButton">
            Idle
        </button>

        <button id="waveButton">
            Wave
        </button>

        <button id="danceButton">
            Dance
        </button>

        <button id="poseButton">
            Pose
        </button>

        <button id="thumbButton">
            👍
        </button>

        <button id="happyButton">
            Happy
        </button>

        <button id="neutralButton">
            Neutral
        </button>

        <button id="stopButton" class="danger">
            Stop
        </button>

    </div>

</div>

<script type="module" src="/src/main.js"></script>

</body>
</html>
