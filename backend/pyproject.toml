[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.5,<6",
    "huggingface-hub>=2.2.0",
    "onnxruntime-openvino==1.23.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "PyYAML>=6.0",
    "fastapi",
    "httpx",
    "pydantic",
    "uvicorn[standard]",
    "faster-whisper==1.2.1",
    "av>=11,<19",
    "websockets>=13.0",
    "psutil>=5.9",
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "insightface>=0.7.3",
    "mediapipe>=0.10",
    "scipy>=1.12",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
