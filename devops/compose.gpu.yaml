# NVIDIA acceleration for this workstation. Compose loads this file automatically.
services:
  nemotron:
    gpus: all
  backend:
    gpus: all
  cv:
    gpus: all
  ollama:
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  kokoro:
    gpus: all
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.9.2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
