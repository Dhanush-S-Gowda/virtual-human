[project]
name = "cv-assistant"
version = "0.1.0"
description = "Real-time computer vision subsystem for the virtual human assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.18",
    "scipy>=1.12",
    "PyYAML>=6.0",
    "websockets>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cv-assistant = "cv_assistant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

